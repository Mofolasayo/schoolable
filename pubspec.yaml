name: schoolable
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.3
  flutter_secure_storage: ^9.0.0
  http: ^1.2.2
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  supabase_flutter: ^2.10.3
  # For check-in feature
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  device_info_plus: ^10.1.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.0
  # For WebSocket real-time messaging
  web_socket_channel: ^2.4.0
  # For push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  # For offline mode and caching
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/.env

# App Launcher Icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/schoolable_logo.png"
  # For Android adaptive icons (recommended for Android 8.0+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/schoolable_logo.png"
  # Minimum SDK for Android adaptive icons
  min_sdk_android: 21
  # For iOS - remove alpha channel for App Store compatibility
  remove_alpha_ios: true
